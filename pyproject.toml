[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-reliability-demo"
version = "0.1.0"
description = "Small FastMCP reliability demo with deterministic incident triage, health checks, usage summaries, and tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
